<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Luyen Viet &amp; Noi tieng Anh co ban - 5 chuyen de, cue card IELTS Speaking Part 2, bai tap tuong tac co cham diem, dap an, giai thich va bang xep hang.">
<title>English Speaking &amp; Writing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
:root{
  --paper:#EFF2F2; --surface:#FFFFFF; --surface-2:#F7F9F9;
  --ink:#12262C; --ink-2:#54696F; --ink-3:#82969A;
  --line:#D8E0DF; --line-2:#C3CFCE;
  --accent:#0C6C78; --accent-ink:#FFFFFF; --accent-soft:#E0EDEE;
  --marker:#D9962A; --marker-soft:#FBEFD9;
  --ok:#1C7A52; --ok-soft:#E2F1E9;
  --no:#B93A31; --no-soft:#FAE7E4;
  --shadow:0 1px 2px rgba(18,38,44,.06), 0 8px 24px -16px rgba(18,38,44,.30);
  --r:4px;
  --f-display:"Newsreader",Georgia,"Times New Roman",serif;
  --f-body:"Be Vietnam Pro","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0D1719; --surface:#152428; --surface-2:#1B2E33;
    --ink:#E6EDEC; --ink-2:#9DB2B4; --ink-3:#7A8F92;
    --line:#26383D; --line-2:#33484D;
    --accent:#4CBECB; --accent-ink:#08282D; --accent-soft:#123138;
    --marker:#E5B558; --marker-soft:#33280F;
    --ok:#54C395; --ok-soft:#123328;
    --no:#E8837A; --no-soft:#361D1A;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -18px rgba(0,0,0,.9);
  }
}
:root[data-theme="dark"]{
  --paper:#0D1719; --surface:#152428; --surface-2:#1B2E33;
  --ink:#E6EDEC; --ink-2:#9DB2B4; --ink-3:#7A8F92;
  --line:#26383D; --line-2:#33484D;
  --accent:#4CBECB; --accent-ink:#08282D; --accent-soft:#123138;
  --marker:#E5B558; --marker-soft:#33280F;
  --ok:#54C395; --ok-soft:#123328;
  --no:#E8837A; --no-soft:#361D1A;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -18px rgba(0,0,0,.9);
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-body);
  font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.wrap{max-width:1060px;margin:0 auto;padding:0 20px 72px}

/* ---------- masthead ---------- */
.mast{border-bottom:2px solid var(--ink);margin-bottom:26px;padding:26px 0 14px}
.mast-row{display:flex;align-items:flex-end;gap:20px;flex-wrap:wrap;justify-content:space-between}
.brand h1{font-family:var(--f-display);font-weight:600;font-size:clamp(28px,5vw,42px);
  line-height:1.02;margin:0;letter-spacing:-.015em;text-wrap:balance}
.brand h1 em{font-style:italic;color:var(--accent)}
.brand p{margin:6px 0 0;color:var(--ink-2);font-size:13.5px;max-width:52ch}
.mast-meta{display:flex;align-items:center;gap:10px}
.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3);
  font-weight:600;margin:0 0 8px}

.who{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r);padding:6px 8px 6px 12px;box-shadow:var(--shadow)}
.who label{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.who input{border:0;background:transparent;width:150px;padding:2px 0;font-size:14px;font-weight:500}
.who input::placeholder{color:var(--ink-3);font-weight:400}

.iconbtn{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  width:34px;height:34px;display:grid;place-items:center;cursor:pointer;color:var(--ink-2);
  box-shadow:var(--shadow)}
.iconbtn:hover{color:var(--accent);border-color:var(--accent)}

/* ---------- nav tabs ---------- */
.tabs{display:flex;gap:2px;margin-bottom:22px;border-bottom:1px solid var(--line)}
.tab{background:none;border:0;border-bottom:2px solid transparent;padding:9px 14px;cursor:pointer;
  color:var(--ink-2);font-weight:500;font-size:14px;margin-bottom:-1px}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
.tab:hover{color:var(--ink)}

/* ---------- topic list ---------- */
.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin:0 0 14px}
.section-head h2{font-family:var(--f-display);font-size:22px;font-weight:600;margin:0;letter-spacing:-.01em}
.section-head span{font-size:12.5px;color:var(--ink-3)}

.topics{display:grid;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.topic{display:grid;grid-template-columns:52px 1fr auto;gap:16px;align-items:center;
  background:var(--surface);border:0;text-align:left;padding:16px 18px;cursor:pointer;width:100%}
.topic:hover{background:var(--surface-2)}
.topic-num{font-family:var(--f-mono);font-size:13px;font-weight:600;color:var(--accent);
  border:1px solid var(--line-2);border-radius:var(--r);height:34px;display:grid;place-items:center}
.topic-t{font-weight:600;font-size:16px;margin:0 0 2px;letter-spacing:-.005em}
.topic-t small{font-family:var(--f-display);font-style:italic;font-weight:400;color:var(--ink-3);
  font-size:14px;margin-left:8px;letter-spacing:0}
.topic-d{margin:0;color:var(--ink-2);font-size:13px}
.topic-score{font-family:var(--f-mono);font-size:12px;font-weight:600;color:var(--ink-2);
  background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r);padding:4px 8px;white-space:nowrap}
.topic-score.best{color:var(--ok);background:var(--ok-soft);border-color:transparent}
@media(max-width:640px){.topic{grid-template-columns:40px 1fr;gap:12px;padding:14px}
  .topic-score{grid-column:2}}

/* ---------- study panel ---------- */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:var(--shadow);padding:24px 26px}
@media(max-width:640px){.panel{padding:18px 16px}}
.panel h2{font-family:var(--f-display);font-size:26px;font-weight:600;margin:0 0 4px;letter-spacing:-.015em}
.panel h2 small{display:block;font-family:var(--f-body);font-size:11px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--accent);font-weight:600;margin-bottom:6px}
.lede{color:var(--ink-2);margin:0 0 22px;font-style:italic;font-family:var(--f-display);font-size:16.5px}

.block{margin:0 0 24px}
.block > h3{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3);
  font-weight:600;margin:0 0 10px;padding-bottom:6px;border-bottom:1px solid var(--line)}

table.vocab{width:100%;border-collapse:collapse;font-size:14px}
table.vocab td{padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top}
table.vocab tr:last-child td{border-bottom:0}
table.vocab td:first-child{font-weight:500;width:46%}
table.vocab td:last-child{color:var(--ink-2)}
table.vocab tr:hover td{background:var(--surface-2)}

ol.frames{margin:0;padding-left:22px;font-size:14.5px}
ol.frames li{margin-bottom:7px}
ol.frames b{font-weight:600;background:var(--marker-soft);padding:0 4px;border-radius:2px}

.cue{border-left:3px solid var(--marker);background:var(--surface-2);padding:14px 16px;border-radius:0 var(--r) var(--r) 0}
.cue b{font-size:15.5px}
.cue ul{margin:8px 0;padding-left:18px;color:var(--ink-2)}
.cue .note{font-size:12.5px;color:var(--ink-3);margin:6px 0 0;font-style:italic}

details.sample{border:1px solid var(--line);border-radius:var(--r);margin-bottom:8px;background:var(--surface-2)}
details.sample summary{cursor:pointer;padding:10px 14px;font-weight:600;font-size:13.5px;list-style:none;display:flex;gap:8px;align-items:center}
details.sample summary::-webkit-details-marker{display:none}
details.sample summary::before{content:"+";font-family:var(--f-mono);color:var(--accent);font-weight:600}
details.sample[open] summary::before{content:"–"}
details.sample p{margin:0;padding:0 14px 14px;font-size:14.5px;color:var(--ink-2);line-height:1.7}
.tips{margin:0;padding-left:20px;font-size:14px;color:var(--ink-2)}
.tips li{margin-bottom:5px}

.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:26px;padding-top:20px;border-top:1px solid var(--line)}
.btn{background:var(--accent);color:var(--accent-ink);border:1px solid var(--accent);border-radius:var(--r);
  padding:11px 20px;font-weight:600;font-size:14.5px;cursor:pointer}
.btn:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
.btn.ghost{background:transparent;color:var(--ink-2);border-color:var(--line-2)}
.btn.ghost:hover{color:var(--ink);border-color:var(--ink-2);filter:none}

/* ---------- quiz ---------- */
.quizbar{display:flex;align-items:center;gap:14px;margin-bottom:20px}
.progress{flex:1;height:5px;background:var(--line);border-radius:99px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);width:0;transition:width .25s ease}
.qcount{font-family:var(--f-mono);font-size:12.5px;font-weight:600;color:var(--ink-2);white-space:nowrap}
.qtimer{font-family:var(--f-mono);font-size:12.5px;font-weight:600;color:var(--ink-3);white-space:nowrap}

.qtype{display:inline-block;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;
  color:var(--accent);background:var(--accent-soft);padding:3px 9px;border-radius:99px;margin-bottom:14px}
.qtext{font-family:var(--f-display);font-size:23px;line-height:1.45;margin:0 0 20px;text-wrap:balance}
.qtext u{text-decoration:none;border-bottom:2px dotted var(--marker);padding:0 2px}
.qhint{font-size:13px;color:var(--ink-3);margin:-12px 0 18px}

.opts{display:grid;gap:8px}
.opt{display:flex;align-items:center;gap:12px;background:var(--surface-2);border:1px solid var(--line);
  border-radius:var(--r);padding:12px 14px;cursor:pointer;text-align:left;font-size:15px;width:100%}
.opt:hover:not(:disabled){border-color:var(--accent);background:var(--accent-soft)}
.opt .key{font-family:var(--f-mono);font-size:12px;font-weight:600;color:var(--ink-3);
  border:1px solid var(--line-2);border-radius:3px;width:22px;height:22px;display:grid;place-items:center;flex:none}
.opt.picked{border-color:var(--accent);background:var(--accent-soft)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .key{color:var(--ok);border-color:var(--ok)}
.opt.wrong{border-color:var(--no);background:var(--no-soft)}
.opt.wrong .key{color:var(--no);border-color:var(--no)}
.opt:disabled{cursor:default}

.gapline{font-family:var(--f-display);font-size:23px;line-height:1.9;margin:0 0 8px}
.gapline input{font-family:var(--f-body);font-size:17px;font-weight:600;border:0;border-bottom:2px solid var(--accent);
  background:var(--marker-soft);width:150px;padding:2px 8px;text-align:center;border-radius:3px 3px 0 0}

.tray{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:14px}
.chip{background:var(--surface-2);border:1px solid var(--line-2);border-radius:var(--r);padding:8px 13px;
  cursor:pointer;font-size:15px;font-weight:500}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.chip.used{opacity:.28;pointer-events:none}
.buildline{min-height:52px;border:1px dashed var(--line-2);border-radius:var(--r);background:var(--surface-2);
  padding:9px;display:flex;flex-wrap:wrap;gap:7px;align-items:flex-start;margin-bottom:14px}
.buildline:empty::before{content:"Bấm các từ bên dưới để xếp thành câu…";color:var(--ink-3);font-size:13.5px;padding:6px}
.buildline .chip{background:var(--accent-soft);border-color:var(--accent)}
.transq{display:inline-block;font-family:var(--f-display);font-size:23px;background:var(--marker-soft);
  padding:4px 12px;border-radius:var(--r);margin-bottom:20px}

.feedback{margin-top:18px;border-radius:var(--r);padding:14px 16px;border-left:3px solid var(--ok);background:var(--ok-soft)}
.feedback.bad{border-left-color:var(--no);background:var(--no-soft)}
.feedback b.verdict{display:block;font-size:14px;margin-bottom:6px;color:var(--ok)}
.feedback.bad b.verdict{color:var(--no)}
.feedback .sol{font-weight:600;margin:0 0 6px;font-size:15px}
.feedback .ex{margin:0;font-size:14px;color:var(--ink-2);line-height:1.65}
.feedback .ex b{color:var(--ink)}

/* ---------- result ---------- */
.scorecard{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);
  border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-bottom:22px}
.scorecard div{background:var(--surface);padding:16px 18px}
.scorecard .lbl{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.scorecard .val{font-family:var(--f-mono);font-size:30px;font-weight:600;line-height:1.2;font-variant-numeric:tabular-nums}
.scorecard .val.pct{color:var(--accent)}
@media(max-width:560px){.scorecard{grid-template-columns:1fr 1fr}}

.review{display:grid;gap:8px}
.rev{border:1px solid var(--line);border-left:3px solid var(--ok);border-radius:var(--r);padding:11px 14px;background:var(--surface-2)}
.rev.bad{border-left-color:var(--no)}
.rev .qq{font-size:14px;margin:0 0 4px;font-weight:500}
.rev .aa{font-size:13.5px;margin:0;color:var(--ink-2)}
.rev .aa b{color:var(--ok)}
.rev.bad .aa b{color:var(--ok)}
.rev .yours{color:var(--no);text-decoration:line-through}

/* ---------- leaderboard ---------- */
.lb-head{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.pill{background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:6px 14px;
  font-size:13px;cursor:pointer;color:var(--ink-2)}
.pill[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink);font-weight:600}
table.lb{width:100%;border-collapse:collapse;font-size:14px;background:var(--surface);
  border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
table.lb th{text-align:left;font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-3);
  font-weight:600;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--surface-2)}
table.lb td{padding:10px 12px;border-bottom:1px solid var(--line)}
table.lb tr:last-child td{border-bottom:0}
table.lb td.rank{font-family:var(--f-mono);font-weight:600;color:var(--ink-3);width:44px;font-variant-numeric:tabular-nums}
table.lb tr.top1 td.rank{color:var(--marker)}
table.lb td.pts{font-family:var(--f-mono);font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
table.lb td.tm{font-family:var(--f-mono);color:var(--ink-3);text-align:right;font-variant-numeric:tabular-nums;font-size:13px}
table.lb tr.me td{background:var(--accent-soft)}
table.lb tr.demo td{color:var(--ink-3);font-style:italic}
.lb-note{font-size:12.5px;color:var(--ink-3);margin:10px 0 0}
.empty{padding:30px;text-align:center;color:var(--ink-3);font-size:14px}
.badge-demo{font-size:10px;letter-spacing:.1em;text-transform:uppercase;border:1px solid var(--line-2);
  border-radius:99px;padding:1px 7px;margin-left:8px;font-style:normal}

.foot{margin-top:34px;padding-top:16px;border-top:1px solid var(--line);font-size:12.5px;color:var(--ink-3);
  display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
.hidden{display:none!important}
</style>

</head>
<body>
<div class="wrap">
  <header class="mast">
    <div class="mast-row">
      <div class="brand">
        <p class="eyebrow">Chuyên đề luyện Viết &amp; Nói · Tiếng Anh cơ bản</p>
        <h1>English Speaking <em>&amp;</em> Writing</h1>
        <p>5 chuyên đề từ cơ bản đến nâng cao, có cue card kiểu IELTS Speaking Part 2, bài mẫu và bài tập tương tác chấm điểm ngay.</p>
      </div>
      <div class="mast-meta">
        <div class="who">
          <label for="who">Tên</label>
          <input id="who" placeholder="Nhập tên của con…" maxlength="24" autocomplete="off">
        </div>
        <button class="iconbtn" id="themeBtn" title="Đổi nền sáng/tối" aria-label="Đổi nền sáng/tối">◐</button>
      </div>
    </div>
  </header>

  <nav class="tabs" role="tablist">
    <button class="tab" role="tab" data-view="home" aria-selected="true">Chuyên đề</button>
    <button class="tab" role="tab" data-view="board" aria-selected="false">Bảng xếp hạng</button>
  </nav>

  <main id="app"></main>

  <footer class="foot">
    <span>English Speaking &amp; Writing — tài liệu luyện viết &amp; nói cho người mới bắt đầu.</span>
    <span id="storeNote"></span>
  </footer>
</div>

<script>
/* ============================================================
   Ngân hàng nội dung & câu hỏi — 5 chuyên đề
   Nguồn: Chuyên đề Luyện Viết & Nói — Tiếng Anh cơ bản (khởi đầu IELTS)
   ============================================================ */
const TOPICS = [
  {
    id: 1,
    vi: "Giới thiệu bản thân",
    en: "About yourself",
    tagline: "Tự giới thiệu tên, tuổi, nơi sống và một vài điều về mình.",
    vocab: [
      ["My name is …", "Tên tôi là …"],
      ["I am … years old", "Tôi … tuổi"],
      ["I live in …", "Tôi sống ở …"],
      ["I am a student at …", "Tôi là học sinh tại …"],
      ["In my free time, I …", "Lúc rảnh, tôi …"],
      ["I am (friendly / hard-working / cheerful)", "Tôi (thân thiện / chăm chỉ / vui vẻ)"],
      ["My dream is to …", "Ước mơ của tôi là …"],
      ["I really enjoy …", "Tôi rất thích …"]
    ],
    frames: [
      "My name is ______. I am ______ years old.",
      "I live in ______ with my ______.",
      "I am a student at ______ School.",
      "In my free time, I like ______.",
      "I am a ______ person, and my dream is to ______."
    ],
    cue: {
      title: "Describe yourself.",
      bullets: ["your name and how old you are", "where you live", "what you like doing in your free time"],
      explain: "and explain what makes you a special or interesting person."
    },
    samples: {
      basic: "Hello! My name is Minh. I am thirteen years old. I live in Hue with my family. I am a student at Nguyen Trai School. In my free time, I like reading books and playing football. I am a friendly person.",
      adv: "Hello, let me introduce myself. My name is Minh and I am thirteen years old. I live in Hue, a beautiful and peaceful city in central Vietnam. I am a student in grade 8, and my favourite subject is English because I want to study abroad one day. In my free time, I enjoy reading books and playing football with my friends. People say I am friendly and hard-working, but I am also a little shy. My dream is to become an English teacher, so I study hard every day.",
      speak: "I'd like to talk about myself. My name is Minh and I'm thirteen years old. I live in Hue with my parents and my younger sister. I'm in grade 8 at Nguyen Trai School. In my free time, I really enjoy reading and playing football, and recently I've started learning English online. I think what makes me a bit special is that I'm very curious — I always ask a lot of questions and I love learning new things. My biggest dream is to study abroad, so I'm working hard to improve my English."
    },
    tips: [
      "Mở đầu bằng một câu chào (Hello / Let me introduce myself).",
      "Dùng từ nối: and, but, because, so để câu mượt hơn.",
      "Kết bằng một câu về ước mơ để đoạn văn có 'điểm nhấn'."
    ],
    mcq: [
      { q: "______ name is Minh.", options: ["My", "I", "Me", "Mine"], a: 0, ex: "Trước danh từ (name) phải dùng tính từ sở hữu <b>my</b>. “I” là chủ ngữ, “me” là tân ngữ, “mine” đứng một mình (It is mine)." },
      { q: "I ______ thirteen years old.", options: ["am", "is", "are", "have"], a: 0, ex: "Chủ ngữ <b>I</b> luôn đi với <b>am</b>. Tiếng Anh nói tuổi bằng động từ “be”: I am 13 years old — KHÔNG nói “I have 13 years old”." },

/* ---- helpers ---- */
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const norm = s => String(s).toLowerCase().replace(/[.,!?;:'"]/g," ").split(" ").filter(Boolean).join(" ");
const mmss = s => Math.floor(s/60) + ":" + String(s%60).padStart(2,"0");
const topicById = id => TOPICS.find(t => t.id === id);
function shuffle(a){const b=a.slice();for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;}

function myName(){ return (nameInput.value || "").trim(); }
function bestFor(id){
  const n = myName().toLowerCase();
  const mine = scores.filter(s => !s.demo && s.topicId === id && (!n || (s.name||"").toLowerCase() === n));
  if(!mine.length) return null;
  return Math.max.apply(null, mine.map(s => s.pct));
}

/* ---- build the 16-question run ---- */
function startQuiz(id){
  const t = topicById(id);
  const items = []
    .concat(t.mcq.map(q => ({type:"mcq", q})))
    .concat(t.gap.map(q => ({type:"gap", q})))
    .concat(t.order.map(q => ({type:"order", q})))
    .concat(t.trans.map(q => ({type:"trans", q})));
  items.forEach(it => {
    if(it.type === "mcq" || it.type === "trans"){
      const pairs = it.q.options.map((o,i) => ({o, right: i === it.q.a}));
      it.shown = shuffle(pairs);
    }
    if(it.type === "order") it.pool = shuffle(it.q.words);
  });
  quiz = {topicId:id, items, i:0, answers:[], stage:"run", t0:Date.now(), locked:false, build:[]};
  go("quiz");
  startTimer();
}
let timerId = null;
function startTimer(){
  clearInterval(timerId);
  timerId = setInterval(() => {
    const el = document.getElementById("timer");
    if(!el || !quiz || quiz.stage !== "run"){ clearInterval(timerId); return; }
    el.textContent = mmss(Math.round((Date.now() - quiz.t0)/1000));
  }, 1000);
}

function renderQuiz(){
  const it = quiz.items[quiz.i];
  const n = quiz.items.length;
  const head =
    '<div class="quizbar"><span class="qcount">Câu ' + (quiz.i+1) + '/' + n + '</span>' +
    '<span class="progress"><i style="width:' + (quiz.i/n*100) + '%"></i></span>' +
    '<span class="qtimer" id="timer">' + mmss(Math.round((Date.now()-quiz.t0)/1000)) + '</span></div>';

  let body = '<span class="qtype">' + TYPE_LABEL[it.type] + '</span>';

  if(it.type === "mcq"){
    body += '<p class="qtext">' + esc(it.q.q).replace(/______/g, "<u>______</u>") + '</p>' +
      '<div class="opts">' + it.shown.map((p,i) =>
        '<button class="opt" data-i="' + i + '"><span class="key">' + "ABCD"[i] + '</span><span>' + esc(p.o) + '</span></button>').join("") + '</div>';
  }
  if(it.type === "trans"){
    body += '<div class="transq">' + esc(it.q.en) + '</div>' +
      '<p class="qhint">Chọn nghĩa tiếng Việt đúng nhất.</p>' +
      '<div class="opts">' + it.shown.map((p,i) =>
        '<button class="opt" data-i="' + i + '"><span class="key">' + "ABCD"[i] + '</span><span>' + esc(p.o) + '</span></button>').join("") + '</div>';
  }
  if(it.type === "gap"){
    body += '<p class="gapline">' + esc(it.q.before) + ' <input id="gapin" autocomplete="off" spellcheck="false"> ' + esc(it.q.after) + '</p>' +
      '<p class="qhint">Điền MỘT từ vào chỗ trống rồi bấm “Kiểm tra”.</p>' +
      '<div class="actions" style="margin-top:8px;padding-top:0;border:0"><button class="btn" id="check">Kiểm tra</button></div>';
  }
  if(it.type === "order"){
    body += '<p class="qtext" style="font-size:17px;color:var(--ink-2)">Sắp xếp các từ thành câu đúng:</p>' +
      '<div class="buildline" id="build"></div>' +
      '<div class="tray" id="tray">' + it.pool.map((w,i) =>
        '<button class="chip" data-i="' + i + '">' + esc(w) + '</button>').join("") + '</div>' +
      '<div class="actions" style="margin-top:8px;padding-top:0;border:0">' +
      '<button class="btn" id="check">Kiểm tra</button>' +
      '<button class="btn ghost" id="clear">Xoá hết</button></div>';
  }

  app.innerHTML = '<article class="panel">' + head + body + '<div id="fb"></div>' +
    '<div class="actions hidden" id="nextwrap"><button class="btn" id="next">' +
    (quiz.i === n-1 ? "Xem kết quả →" : "Câu tiếp theo →") + '</button></div></article>';

  quiz.locked = false;
  if(it.type === "mcq" || it.type === "trans"){
    app.querySelectorAll(".opt").forEach(b => b.addEventListener("click", () => {
      if(quiz.locked) return;
      answer(it.shown[+b.dataset.i].right, it.shown[+b.dataset.i].o, +b.dataset.i);
    }));
  }
  if(it.type === "gap"){
    const inp = document.getElementById("gapin");
    inp.focus();
    inp.addEventListener("keydown", e => { if(e.key === "Enter"){ e.preventDefault(); doGap(); }});
    document.getElementById("check").addEventListener("click", doGap);
  }
  if(it.type === "order"){
    quiz.build = [];
    const paint = () => {
      const bl = document.getElementById("build");
      bl.innerHTML = quiz.build.map((x,k) => '<button class="chip" data-k="' + k + '">' + esc(it.pool[x]) + '</button>').join("");
      bl.querySelectorAll(".chip").forEach(c => c.addEventListener("click", () => {
        if(quiz.locked) return;
        quiz.build.splice(+c.dataset.k,1); paint();
      }));
      app.querySelectorAll("#tray .chip").forEach((c,idx) =>
        c.classList.toggle("used", quiz.build.indexOf(idx) >= 0));
    };
    app.querySelectorAll("#tray .chip").forEach(c => c.addEventListener("click", () => {
      if(quiz.locked) return;
      quiz.build.push(+c.dataset.i); paint();
    }));
    document.getElementById("clear").addEventListener("click", () => { if(!quiz.locked){ quiz.build = []; paint(); }});
    document.getElementById("check").addEventListener("click", () => {
      const said = quiz.build.map(x => it.pool[x]).join(" ");
      answer(norm(said) === norm(it.q.a), said || "(chưa xếp)");
    });
    paint();
  }
  function doGap(){
    if(quiz.locked) return;
    const v = document.getElementById("gapin").value.trim();
    answer(it.q.a.some(x => norm(x) === norm(v)) && v !== "", v || "(bỏ trống)");
  }
}

function answer(correct, given, pickIdx){
  quiz.locked = true;
  const it = quiz.items[quiz.i];
  const solution = it.type === "mcq" ? it.q.options[it.q.a]
    : it.type === "trans" ? it.q.options[it.q.a]
    : it.type === "gap" ? it.q.a[0]
    : it.q.a;
  quiz.answers.push({type:it.type, correct, given, solution, ex:it.q.ex,
    label: it.type === "mcq" ? it.q.q : it.type === "trans" ? it.q.en : it.type === "gap"
      ? (it.q.before + " ______ " + it.q.after) : it.q.words.join(" / ")});

  if(it.type === "mcq" || it.type === "trans"){
    app.querySelectorAll(".opt").forEach((b,i) => {
      b.disabled = true;
      if(it.shown[i].right) b.classList.add("right");
      else if(i === pickIdx) b.classList.add("wrong");
    });
  }
  if(it.type === "gap"){ const inp = document.getElementById("gapin"); if(inp) inp.disabled = true; }
  const chk = document.getElementById("check"); if(chk) chk.disabled = true;
  const clr = document.getElementById("clear"); if(clr) clr.disabled = true;

  document.getElementById("fb").innerHTML =
    '<div class="feedback' + (correct ? "" : " bad") + '">' +
    '<b class="verdict">' + (correct ? "✓ Chính xác!" : "✗ Chưa đúng") + '</b>' +
    (correct ? "" : '<p class="sol">Đáp án đúng: ' + esc(solution) + '</p>') +
    '<p class="ex">' + it.q.ex + '</p></div>';

  const nw = document.getElementById("nextwrap");
  nw.classList.remove("hidden");
  const nb = document.getElementById("next");
  nb.focus();
  nb.addEventListener("click", () => {
    if(quiz.i < quiz.items.length - 1){ quiz.i++; renderQuiz(); window.scrollTo({top:0,behavior:"smooth"}); }
    else finish();
  });
}

async function finish(){
  clearInterval(timerId);
  quiz.stage = "done";
  quiz.seconds = Math.round((Date.now() - quiz.t0)/1000);
  const correct = quiz.answers.filter(a => a.correct).length;
  quiz.correct = correct;
  quiz.pct = Math.round(correct / quiz.answers.length * 100);
  go("result");
  const nm = myName();
  if(nm){
    const entry = {name:nm, topicId:quiz.topicId, correct, total:quiz.answers.length,
      pct:quiz.pct, seconds:quiz.seconds, at:Date.now()};
    try{ await Store.add(entry); scores = await Store.list(); }catch(e){}
    if(view === "result") renderResult();
  }
}

function renderResult(){
  const t = topicById(quiz.topicId);
  const nm = myName();
  app.innerHTML = '<article class="panel">' +
    '<h2><small>Kết quả · Chuyên đề 0' + t.id + '</small>' + esc(t.vi) + '</h2>' +
    '<p class="lede">' + (quiz.pct >= 80 ? "Rất tốt! Con nắm chắc chuyên đề này rồi."
      : quiz.pct >= 50 ? "Khá ổn — đọc lại phần giải thích bên dưới rồi làm lại nhé."
      : "Chưa sao cả. Xem lại từ vựng &amp; khung câu của chuyên đề rồi thử lại.") + '</p>' +
    '<div class="scorecard">' +
      '<div><div class="lbl">Điểm</div><div class="val pct">' + quiz.pct + '%</div></div>' +
      '<div><div class="lbl">Số câu đúng</div><div class="val">' + quiz.correct + '<span style="font-size:16px;color:var(--ink-3)">/' + quiz.answers.length + '</span></div></div>' +
      '<div><div class="lbl">Thời gian</div><div class="val">' + mmss(quiz.seconds) + '</div></div>' +
    '</div>' +
    (nm ? '<p class="lb-note" style="margin:-10px 0 20px">Đã ghi tên <b>' + esc(nm) + '</b> vào bảng xếp hạng.</p>'
        : '<p class="lb-note" style="margin:-10px 0 20px;color:var(--no)">Chưa có tên nên kết quả không vào bảng xếp hạng — nhập tên ở góc trên rồi làm lại nhé.</p>') +
    '<div class="block"><h3>Xem lại từng câu</h3><div class="review">' +
    quiz.answers.map(a =>
      '<div class="rev' + (a.correct ? "" : " bad") + '">' +
      '<p class="qq">' + esc(a.label) + '</p>' +
      '<p class="aa">' + (a.correct ? "Con trả lời: <b>" + esc(a.given) + "</b>"
        : 'Con trả lời: <span class="yours">' + esc(a.given) + '</span> · Đáp án: <b>' + esc(a.solution) + '</b>') +
      '<br><span style="color:var(--ink-3)">' + a.ex + '</span></p></div>').join("") +
    '</div></div>' +
    '<div class="actions">' +
      '<button class="btn" id="again">Làm lại chuyên đề này</button>' +
      '<button class="btn ghost" id="toboard">Xem bảng xếp hạng</button>' +
      '<button class="btn ghost" id="home">← Chuyên đề khác</button>' +
    '</div></article>';
  document.getElementById("again").addEventListener("click", () => startQuiz(t.id));
  document.getElementById("toboard").addEventListener("click", () => go("board"));
  document.getElementById("home").addEventListener("click", () => go("home"));
}

function renderBoard(){
  const real = scores.filter(s => !s.demo);
  const rows = (real.length ? real : DEMO)
    .filter(s => boardFilter === "all" || s.topicId === +boardFilter)
    .sort((a,b) => b.pct - a.pct || a.seconds - b.seconds || a.at - b.at)
    .slice(0, 50);
  const nm = myName().toLowerCase();

  app.innerHTML =
    '<div class="section-head"><h2>Bảng xếp hạng</h2><span>Sắp theo điểm, đồng điểm thì ai nhanh hơn xếp trên</span></div>' +
    '<div class="lb-head">' +
      '<button class="pill" data-f="all" aria-pressed="' + (boardFilter === "all") + '">Tất cả chuyên đề</button>' +
      TOPICS.map(t => '<button class="pill" data-f="' + t.id + '" aria-pressed="' + (boardFilter == t.id) + '">0' + t.id + ' · ' + esc(t.vi) + '</button>').join("") +
    '</div>' +
    (rows.length ? '<table class="lb"><thead><tr><th>#</th><th>Tên</th><th>Chuyên đề</th>' +
      '<th style="text-align:right">Điểm</th><th style="text-align:right">Đúng</th><th style="text-align:right">Thời gian</th></tr></thead><tbody>' +
      rows.map((s,i) =>
        '<tr class="' + (i === 0 ? "top1 " : "") + (s.demo ? "demo " : "") +
        (!s.demo && nm && (s.name||"").toLowerCase() === nm ? "me" : "") + '">' +
        '<td class="rank">' + (i+1) + '</td>' +
        '<td>' + esc(s.name) + (s.demo ? '<span class="badge-demo">ví dụ</span>' : "") + '</td>' +
        '<td style="color:var(--ink-2)">' + esc((topicById(s.topicId)||{vi:"?"}).vi) + '</td>' +
        '<td class="pts">' + s.pct + '%</td>' +
        '<td class="pts" style="color:var(--ink-2)">' + s.correct + '/' + s.total + '</td>' +
        '<td class="tm">' + mmss(s.seconds) + '</td></tr>').join("") +
      '</tbody></table>' : '<div class="empty">Chưa có ai làm bài ở chuyên đề này.</div>') +
    (real.length ? "" : '<p class="lb-note">Đây là ba dòng ví dụ để con thấy bảng xếp hạng trông thế nào. Làm xong bài đầu tiên là chúng biến mất.</p>');

  app.querySelectorAll(".pill").forEach(b => b.addEventListener("click", () => {
    boardFilter = b.dataset.f; renderBoard();
  }));
}

/* ============================ boot ============================ */
(async function boot(){
  render();
  try{ scores = await Store.list(); }catch(e){ scores = []; }
  Store.watch && Store.watch(list => { scores = list; if(view === "board") renderBoard(); if(view === "home") renderHome(); });
  document.getElementById("storeNote").textContent = Store.note;
  if(view === "board") renderBoard(); else if(view === "home") renderHome();
})();
</script>

</body>
</html>
